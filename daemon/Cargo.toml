[package]
name = "sidecard"
description = "Linux daemon for sidecarforlinux: iPad + Apple Pencil Pro as pen tablet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sidecar-protocol = { path = "../protocol/rust" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
evdev = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls-pki-types = "1"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
mdns-sd = { version = "0.21", default-features = false }
directories = "6"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
