[package]
name = "sidecard"
description = "Linux daemon for sidecarforlinux: iPad + Apple Pencil Pro as pen tablet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sidecar-protocol = { path = "../protocol/rust" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls-pki-types = "1"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
mdns-sd = { version = "0.21", default-features = false }
directories = "6"
libc = "0.2"
# Phase 2 (virtual display). Pure-Rust Wayland client, no system libraries.
wayland-client = { version = "0.31", optional = true }
wayland-protocols-plasma = { version = "0.3", features = ["client"], optional = true }

# uinput is Linux-only; on other systems (macOS CI interop tests) the daemon
# builds with --dry-run sinks only.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
# Native capture (PipeWire consumer). libpipewire is LGPL-2.1, linked
# dynamically; the bindings are MIT. Builds need libpipewire/libspa headers
# and libclang (bindgen). See docs/dependencies.md.
pipewire = { version = "0.10", optional = true, features = ["v1_0_0"] }

[features]
default = ["display", "native-video"]
display = ["dep:wayland-client", "dep:wayland-protocols-plasma"]
# In-process capture + VA-API encode ([video] backend = "native"). Linux only:
# on other systems the feature compiles to nothing.
native-video = ["dep:pipewire", "dep:bindgen"]

[build-dependencies]
# libva bindings for the native encoder, generated at build time (needs
# libclang and the libva headers); only used on Linux with native-video.
bindgen = { version = "0.72", optional = true }

[dev-dependencies]
tempfile = "3"
